# 本地 Chroma 向量数据库服务（RAG 第③步）
#
# 启动：docker compose up -d chroma
# 停止：docker compose down
# 查看日志：docker compose logs -f chroma
#
# 说明：
# - 宿主机端口用 8100，避免和 Web 后端（8000）/ 其他服务冲突；
# - 数据挂载到 ./.rag/chroma，已在 .gitignore 中忽略（索引是生成物，可重建）；
# - ANONYMIZED_TELEMETRY=FALSE 关闭匿名遥测。
services:
  chroma:
    image: chromadb/chroma:1.3.5
    container_name: skills-agent-chroma
    ports:
      - "127.0.0.1:8100:8000"
    volumes:
      - ./.rag/chroma:/data
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
